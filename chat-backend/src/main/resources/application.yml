server:
  port: 8080
  # Đứng sau proxy: tin các header X-Forwarded-* để lấy IP/giao thức thật
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    max-threads: 200
    connection-timeout: 20s

spring:
  application:
    name: chatnest-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ha_Noi
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jpa:
    open-in-view: false

# Cấu hình riêng của ứng dụng chat
chatnest:
  room:
    max-size-default: 20          # số người tối đa mỗi phòng
    max-size-limit: 100           # trần cho phép khi tạo phòng
    max-name-length: 50
    empty-room-ttl-minutes: 10    # phòng trống quá lâu thì xóa
  message:
    max-length: 500               # tính theo code point, không phải char
    history-size: 50              # số tin trả về khi vào phòng
    rate-limit-per-second: 5      # chống spam trong một session
  nickname:
    min-length: 2
    max-length: 20
  sticker:
    config-file: classpath:stickers.json
  filter:
    banned-words-file: classpath:banned-words.txt
  websocket:
    path: /ws/rooms/{roomId}
    max-text-message-size: 8192   # byte
    idle-timeout-seconds: 300
    # Origin được phép kết nối WebSocket (chống Cross-Site WebSocket Hijacking)
    allowed-origins: "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.chatnest: INFO